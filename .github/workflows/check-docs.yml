name: Check learning materials

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check generated gallery
        run: python scripts/build_docs.py --check
      - name: Check files and presentation
        run: python scripts/check_repository.py
